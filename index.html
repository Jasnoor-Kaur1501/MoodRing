<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoodRing</title>

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="app">
    <h1>MoodRing</h1>
    <p class="subtitle">Your mood will live here.</p>

    <div class="ring">
      <div class="core"></div>
    </div>

    <div class="moods">
      <button data-mood="calm">Calm</button>
      <button data-mood="happy">Happy</button>
      <button data-mood="chaotic">Chaotic</button>
      <button data-mood="sleepy">Sleepy</button>
      <button data-mood="romantic">Romantic</button>
      <button data-mood="focused">Focused</button>
    </div>

    <p class="mood-text">Choose a mood.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
